version: '3.8'

services:
  app:
    build: .
    container_name: agentic_app_target
    ports:
      - "8000:8000"
    environment:
      - ENV=testing
    networks:
      - attack_net

  zap:
    image: owasp/zap2docker-stable
    container_name: zap
    ports:
      - "8090:8090" # ZAP UI
      - "8080:8080" # ZAP proxy
    networks:
      - attack_net

  attacker:
    image: python:3.11-slim
    container_name: attack_runner
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["/bin/sh", "-c", "pip install -r requirements.txt && python scripts/attack_simulator.py --target http://app:8000 --output /workspace/attack_results && sleep 1d"]
    depends_on:
      - app
      - zap
    networks:
      - attack_net

networks:
  attack_net:
    driver: bridge
