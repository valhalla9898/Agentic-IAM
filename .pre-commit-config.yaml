repos:
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.0
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-autoflake
    rev: v1.4
    hooks:
      - id: autoflake
        args: ["--remove-all-unused-imports", "--in-place", "--aggressive", "--aggressive"]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["app.py", "run_gui.py", "dashboard/components/ai_assistant.py", "dashboard/components/ai_kb.py", "scripts/ask_ai.py", "tests/test_unit/test_ai_cli.py"]

  - repo: local
    hooks:
      - id: ai-cli-smoke
        name: AI CLI smoke tests
        entry: python -m pytest tests/test_unit/test_ai_cli.py -q -o addopts=
        language: system
        pass_filenames: false
